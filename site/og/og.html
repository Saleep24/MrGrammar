<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{font-family:"Inter",-apple-system,sans-serif;font-feature-settings:"cv11","ss03";color:#1d1d1f;background:#fff;-webkit-font-smoothing:antialiased;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(70% 60% at 30% 0%,rgba(46,67,240,.14),transparent 70%),radial-gradient(40% 40% at 90% 90%,rgba(255,190,120,.16),transparent 70%)}
.wrap{position:relative;padding:72px 80px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:26px;letter-spacing:-.02em}
.brand img{width:40px;height:40px;border-radius:9px}
h1{font-size:96px;font-weight:700;letter-spacing:-.045em;line-height:.98}
h1 .g{background:#dcf5e3;color:#146c3a;border-radius:14px;padding:0 10px;margin:0 -10px}
p{font-size:28px;color:#6e6e73;margin-top:24px;max-width:30ch;letter-spacing:-.01em}
.foot{display:flex;align-items:center;gap:18px;font-size:20px;color:#6e6e73;font-weight:500}
.btn{background:#2e43f0;color:#fff;border-radius:999px;padding:14px 26px;font-weight:600;font-size:22px}
.stars{color:#f5a623;letter-spacing:2px}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap">
  <div class="brand"><img src="../assets/icon.png" alt="">MrGrammar</div>
  <div>
    <h1>Fix <span class="g">grammar</span><br>anywhere you type.</h1>
    <p>Free Chrome extension. Select, right-click, done.</p>
  </div>
  <div class="foot"><span class="btn">Add to Chrome</span><span><span class="stars">★★★★★</span> 5.0 on the Chrome Web Store</span><span>·</span><span>Free, open source</span></div>
</div>
</body>
</html>
