<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>MrGrammar</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <div class="header">
      <div class="brand">
        <h1>MrGrammar</h1>
        <span class="version" id="version"></span>
      </div>
    </div>

    <div class="content">
      <p class="howto">Select text, then right-click and choose <strong>Fix Grammar with AI</strong> or press the shortcut.</p>

      <div class="row">
        <span class="row-label">Shortcut</span>
        <div class="row-value">
          <kbd class="shortcut-key" id="keyboard-shortcut">...</kbd>
          <button type="button" class="text-btn" id="change-shortcut">Change</button>
        </div>
      </div>

      <div class="row">
        <span class="row-label">Status</span>
        <div class="row-value" role="status">
          <div class="status-dot" id="api-status-indicator" aria-hidden="true"></div>
          <span class="status-text" id="api-status-text">Checking...</span>
        </div>
      </div>

      <div class="row">
        <span class="row-label">Corrections</span>
        <span class="row-value status-text" id="correction-count">0</span>
      </div>
    </div>

    <div class="actions">
      <button class="action-btn" id="options-btn" title="Settings" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
      <button class="action-btn" id="help-btn" title="Report a problem" aria-label="Report a problem">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <path d="M12 17h.01"></path>
          <circle cx="12" cy="12" r="10"></circle>
        </svg>
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
