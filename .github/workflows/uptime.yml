name: Uptime

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

env:
  PROXY: https://proxy-khaki-eight-20.vercel.app/api/grammar

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight responds
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X OPTIONS "$PROXY")
          echo "OPTIONS -> $code"
          test "$code" = "200"
      - name: Outsiders are refused
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST "$PROXY" \
            -H 'Content-Type: application/json' -d '{"text":"I goes to the store."}')
          echo "POST without origin -> $code"
          test "$code" = "403"
      - name: Correction round trip
        env:
          ACCESS_CODE: ${{ secrets.PROXY_ACCESS_CODE }}
        run: |
          if [ -z "$ACCESS_CODE" ]; then echo "PROXY_ACCESS_CODE secret not set, skipping"; exit 0; fi
          body=$(curl -s --max-time 40 -X POST "$PROXY" \
            -H 'Content-Type: application/json' -H "X-Access-Code: $ACCESS_CODE" \
            -d '{"text":"I goes to the store."}')
          echo "POST -> $body"
          echo "$body" | grep -q '"correctedText"'
