<!doctype html><html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:440px;height:280px;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#18181b 0%,#2a2a30 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 36px;-webkit-font-smoothing:antialiased}
.row{display:flex;align-items:center;gap:16px}
.row img{width:56px;height:56px;border-radius:12px}
h1{font-size:34px;font-weight:700;letter-spacing:-0.03em}
p{margin-top:18px;font-size:17px;line-height:1.45;color:rgba(255,255,255,.78)}
.pill{margin-top:22px;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:7px 12px;border-radius:999px;font-size:13px;color:rgba(255,255,255,.9);width:fit-content}
.dot{width:6px;height:6px;border-radius:50%;background:#4ade80}
</style></head><body>
<div class="row"><img src="icon-128.png" alt=""><h1>MrGrammar</h1></div>
<p>Free grammar correction in any text box. Select, right-click, fixed in place.</p>
<span class="pill"><span class="dot"></span>No account, no API key, nothing to set up</span>
</body></html>
